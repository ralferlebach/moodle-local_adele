# Jest: the Vue frontend's unit tests, with their report and coverage as an
# artefact (Jest issue, "CI": "Testreport und lcov sollen als CI-Artefakte
# verfügbar sein").
#
# The same suite also runs inside "Moodle Plugin CI" (custom_steps), where it
# fails the job - that gate stays. Its reusable workflow cannot upload files,
# which is why this job exists: a red test or a coverage below the gate in
# vue3/jest.config.js fails here too, and either way the report is kept.
name: Jest

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Build gate (#18 DoD6): the bundle in amd/ must be built from the
      # sources of this commit (buildtools/check-bundle.js compares the source
      # hash webpack writes into it), and the sources must still build (last
      # step). It runs BEFORE the installation: "npm install --save-dev
      # @babel/plugin-syntax-dynamic-import" below adds a line to package.json,
      # which is one of the hashed sources - checked after it, the gate
      # compared the bundle with a package.json that is not the commit's
      # (run 45034960566, 2026-11-22). Needs no dependencies.
      - name: Check that the shipped bundle is built from these sources
        working-directory: vue3
        run: node buildtools/check-bundle.js

      # The remaining checks run even when the gate is red, so one run gives
      # every result.
      - name: Install the dependencies
        working-directory: vue3
        if: ${{ !cancelled() }}
        run: |
          # Same flags as in Moodle Plugin CI, so both runs test the same tree.
          npm install --force
          npm install --save-dev @babel/plugin-syntax-dynamic-import --force

      - name: Run the tests with coverage
        working-directory: vue3
        if: ${{ !cancelled() }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --ci 2>&1 | tee jest-run.log; exit "${PIPESTATUS[0]}"

      # Lint gate (#18 DoD6) as a ratchet: no finding beyond
      # buildtools/lint-baseline.json (the findings the code had when the
      # gate came; lower it when findings go away).
      - name: Lint the Vue sources
        working-directory: vue3
        if: ${{ !cancelled() }}
        run: node buildtools/lint-gate.js

      - name: Check that the sources build
        working-directory: vue3
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Keep the report and the coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jest-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vue3/test-report.html
            vue3/jest-run.log
            vue3/coverage/lcov.info
            vue3/coverage/lcov-report
          if-no-files-found: warn
          retention-days: 30
