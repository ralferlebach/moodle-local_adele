name: Load test (k6)

# Minimal read-endpoint load test for local_adele. Manual only.
#   selfcontained (default): build a fresh Moodle plus the sibling plugins,
#     seed and load-test here.
#   external: point at a Moodle you already run and seeded.
#
# Deliberately small: it exists to prove the pipeline runs end to end. Widen
# the plan once the numbers are trusted.
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'selfcontained (build+seed here) or external (your own site)'
        type: choice
        options: [selfcontained, external]
        default: selfcontained
        required: true
      base_url:
        description: '[external] Base URL of your seeded Moodle'
        required: false
      courseid:
        description: '[external] Course id carrying the seeded learning path'
        required: false
      admin_user:
        description: '[external] Login used to read the pages under test'
        required: false
        default: admin
      admin_password:
        description: '[external] Password for that login'
        required: false
      users:
        description: Seeded learners on the learning path
        default: '25'
        required: false
      vus:
        description: Concurrent virtual users
        default: '10'
        required: false
      duration:
        description: Plateau duration
        default: '30s'
        required: false

jobs:
  k6:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready" --health-interval=10s
          --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: MOODLE_405_STABLE
      MOODLE_WWWROOT: http://127.0.0.1:8000

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        if: ${{ github.event.inputs.mode == 'selfcontained' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000

      - name: Build, install and seed a self-contained site
        id: selfcontained
        if: ${{ github.event.inputs.mode == 'selfcontained' }}
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" \
            https://github.com/moodle/moodle.git moodle
          rm -rf moodle/local/adele
          mkdir -p moodle/local && cp -a plugin moodle/local/adele
          rm -rf moodle/local/adele/.git

          # The three plugins declare each other as dependencies and the graph
          # is deliberately circular, so the site cannot install with
          # local_adele alone. SIBLING_REF pins the ref the siblings come from
          # and defaults to the branch this workflow runs on.
          SIBLING_REF="${SIBLING_REF:-$GITHUB_REF_NAME}"
          for pair in "enrol:enrol/adele" "mod:mod/adele"; do
            sib="${pair%%:*}"; dest="${pair##*:}"
            git clone --depth 1 --branch "$SIBLING_REF" \
              "https://github.com/ralferlebach/moodle-${sib}_adele.git" "/tmp/sib_${sib}" \
              || git clone --depth 1 "https://github.com/ralferlebach/moodle-${sib}_adele.git" "/tmp/sib_${sib}"
            mkdir -p "$(dirname "moodle/${dest}")"
            cp -a "/tmp/sib_${sib}" "moodle/${dest}"
            rm -rf "moodle/${dest}/.git"
          done

          mkdir -p /tmp/moodledata
          cd moodle
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="ADELE CI" --shortname="adeleci" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid

          # No web server is started here: seeding is a CLI script and does not
          # need one, and a background server does not reliably survive beyond
          # the step that started it. Every step that needs HTTP starts and
          # awaits its own.
          ADELE_SEED_I_KNOW=1 ADELE_LOAD_USERS="${{ github.event.inputs.users }}" \
            php local/adele/tests/load/seed_large.php > /tmp/seed.env
          get() { sed -n "s/^export $1='\(.*\)'$/\1/p" /tmp/seed.env; }
          {
            echo "base_url=$(get ADELE_BASE_URL)"
            echo "courseid=$(get ADELE_COURSE_ID)"
            echo "admin_user=$(get ADELE_ADMIN_USER)"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(get ADELE_ADMIN_PASSWORD)"
          echo "admin_password=$(get ADELE_ADMIN_PASSWORD)" >> "$GITHUB_OUTPUT"

      - name: Resolve run parameters
        id: params
        run: |
          if [ "${{ github.event.inputs.mode }}" = "external" ]; then
            echo "base_url=${{ github.event.inputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "courseid=${{ github.event.inputs.courseid }}" >> "$GITHUB_OUTPUT"
            echo "admin_user=${{ github.event.inputs.admin_user }}" >> "$GITHUB_OUTPUT"
            echo "admin_password=${{ github.event.inputs.admin_password }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${{ steps.selfcontained.outputs.base_url }}" >> "$GITHUB_OUTPUT"
            echo "courseid=${{ steps.selfcontained.outputs.courseid }}" >> "$GITHUB_OUTPUT"
            echo "admin_user=${{ steps.selfcontained.outputs.admin_user }}" >> "$GITHUB_OUTPUT"
            echo "admin_password=${{ steps.selfcontained.outputs.admin_password }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run load plan
        run: |
          # Serve with multiple workers so parallel requests do not serialise.
          # Started inside THIS step so it is alive for the whole run.
          #
          # Bound to 127.0.0.1 rather than "localhost": PHP's built-in server
          # listens on a single address while clients resolve "localhost"
          # differently - curl reached the server while the load tool tried
          # ::1 and reported connection errors.
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t moodle >/tmp/moodle-server.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://127.0.0.1:8000/login/index.php || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "Der Moodle-Testserver ist nicht erreichbar geworden (HTTP $code)."
            cat /tmp/moodle-server.log || true
            exit 1
          fi
          # Pre-flight against the ACTUAL target: a dead site otherwise shows
          # up as a wall of failed samples and looks like a plugin problem.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${{ steps.params.outputs.base_url }}/login/index.php" || true)
          if [ "$code" != "200" ]; then
            echo "Ziel ist nicht erreichbar (HTTP $code): ${{ steps.params.outputs.base_url }}"
            cat /tmp/moodle-server.log || true
            exit 1
          fi
          k6 run \
            -e BASE_URL='${{ steps.params.outputs.base_url }}' \
            -e COURSEID='${{ steps.params.outputs.courseid }}' \
            -e ADMIN_USER='${{ steps.params.outputs.admin_user }}' \
            -e ADMIN_PASSWORD='${{ steps.params.outputs.admin_password }}' \
            -e VUS='${{ github.event.inputs.vus }}' \
            -e DURATION='${{ github.event.inputs.duration }}' \
            --summary-export=k6-summary.json \
            plugin/tests/load/adele-read-endpoints.js

      - name: Show Moodle server log on failure
        if: failure() && github.event.inputs.mode == 'selfcontained'
        run: tail -100 /tmp/moodle-server.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: k6-summary.json
          retention-days: 7
          if-no-files-found: ignore
